[platformio]
default_envs = esp32-s3-wroom

[env]
extra_scripts =
    pre:scripts/platformio_generate_telemetry.py
    pre:scripts/platformio_generate_led_strip_images.py
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --inline-suppr --suppress=unusedFunction
check_src_filters =
    +<include/>
    +<lib/>
    +<src/>
    +<test/>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = 
    -Iinclude
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0

[env:esp32-s3-wroom]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Custom 16 MB partition layout with LittleFS
board_build.partitions = partitions_16mb_logger.csv
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

[env:esp32-s3-wroom-ota]
extends = env:esp32-s3-wroom
upload_protocol = espota
upload_port = 192.168.4.1 
